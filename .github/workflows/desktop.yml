# Builds the Quiz Duel app for Windows and Mac and attaches the installers to a GitHub release.
# Run it: publish a GitHub release (the installers are attached to it), or press "Run workflow" on the Actions tab.
name: Build Quiz Duel app
on:
  push:                     # any change to the app's code builds it and publishes a new release automatically
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point the app at your website
        if: ${{ vars.QUIZDUEL_SITE_URL != '' }}
        shell: bash
        env:
          SITE_URL: ${{ vars.QUIZDUEL_SITE_URL }}
        run: |
          echo "{ \"siteUrl\": \"$SITE_URL\" }" > app/config.json
      - name: Build the keyboard guard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize /out:bin\QuizDuelKeys.exe /reference:System.Windows.Forms.dll native\QuizDuelKeys.cs
          if (!(Test-Path bin\QuizDuelKeys.exe)) { throw "keyboard guard did not build" }
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-duel-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Quiz Duel app (build ${{ github.run_number }})
          make_latest: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
