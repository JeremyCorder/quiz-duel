<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Quiz Duel</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10143f;color:#eef2ff;font:17px/1.5 "Segoe UI",system-ui,sans-serif;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:16px;background:#5ce1ff;color:#071038;font:800 40px/72px "Segoe UI",sans-serif;box-shadow:0 0 30px #5ce1ff88;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(.92);box-shadow:0 0 12px #5ce1ff55}}p{color:#aab3e6;margin:6px 0}
button{font:inherit;font-weight:700;border-radius:3px 12px 3px 12px;padding:10px 20px;margin-top:18px;cursor:pointer;background:transparent;color:#eef2ff;border:1px solid #5560c4}
.slow{visibility:hidden}.slow.show{visibility:visible}.keys{font-size:14px;color:#8a93c9}</style></head>
<body><div><div class="logo">Q</div><h1 style="margin:0">Quiz Duel</h1><p>Starting... connecting to your quiz</p>
<div class="slow" id="slow"><p>This is taking longer than usual.</p></div>
<button id="quit">Close Quiz Duel</button>
<p class="keys">You can also press Up, Up, Down, Up (arrow keys) or Ctrl+Shift+Alt+Q to close.</p></div>
<script>document.getElementById("quit").onclick=()=>{try{window.quizDuelApp.quit()}catch(e){window.close()}};
setTimeout(()=>document.getElementById("slow").classList.add("show"),6000);</script></body></html>
