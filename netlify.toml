# Quiz Duel on Netlify: builds the site from src/.
[build]
  command = "python3 build.py"
  publish = "site"
  # Only rebuild the website when the website's files changed (app-only changes don't use Netlify build credits).
  # Netlify skips the build when this command succeeds (= nothing in these files changed).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ build.py netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
