# Quiz Duel on Netlify: builds the site from src/.
# In Netlify > Site configuration > Environment variables, add:
#   GEMINI_API_KEY    your Google Gemini API key (never put it in the code)
#   TEACHER_PASSWORD  the teacher password (teacher12345), so only teachers can use the AI
[build]
  command = "python3 build.py"
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
