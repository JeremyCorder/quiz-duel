<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Duel</title>
<meta name="description" content="Live, locked-down quizzes for any subject. Teachers watch every answer; students join with a code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235ce1ff'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='%23071038' font-family='Arial'%3EQ%3C/text%3E%3C/svg%3E">
<style>
/* Quiz Duel: a deep-indigo "flight deck" with cyan signal colour. Angled corners are the house shape.
   Anything a student writes sits on white "paper" so colours and highlights look the same for
   student and teacher in either theme. Green/amber/red are only for right/half/wrong. */
@font-face { font-family: "Lexend"; src: url("fonts/lexend.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Oxanium"; src: url("fonts/oxanium.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "OpenDyslexic"; src: url("fonts/opendyslexic-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "OpenDyslexic"; src: url("fonts/opendyslexic-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --bg: #10143f; --bg2: #0a0d31; --card: #1a1f5c; --card-2: #242b78; --ink: #eef2ff; --muted: #aeb8ea; --line: #3a45a3;
  --head: #ffffff; --accent: #5ce1ff; --on-accent: #071038; --accent-soft: rgba(92,225,255,.15); --violet: #a99bff;
  --good: #5be3a0; --good-soft: rgba(91,227,160,.17); --warn: #ffcb5c; --warn-soft: rgba(255,203,92,.17);
  --bad: #ff8292; --bad-soft: rgba(255,122,138,.2); --on-solid: #071038;
  --field: #0c1036; --field-line: #5560c4; --grid: rgba(92,225,255,.09); --glow: 0 0 0 1px rgba(92,225,255,.25), 0 10px 40px rgba(4,6,30,.45);
  --paper: #ffffff; --paper-ink: #16193a;
  --ui: "Lexend", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Oxanium", "Lexend", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, "Courier New", monospace;
  --r-card: 4px 22px 4px 22px; --r-btn: 3px 12px 3px 12px; --r-in: 3px 10px 3px 10px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eceffe; --bg2: #171b5e; --card: #ffffff; --card-2: #f0f2ff; --ink: #171a45; --muted: #535c8e; --line: #cdd3f5;
  --head: #1c1f6b; --accent: #3d2fe0; --on-accent: #ffffff; --accent-soft: #e6e4fd; --violet: #5a45d6;
  --good: #12804a; --good-soft: #ddf5e7; --warn: #946000; --warn-soft: #fff1cc;
  --bad: #c5283d; --bad-soft: #fde3e6; --on-solid: #ffffff;
  --field: #ffffff; --field-line: #aeb6e6; --grid: rgba(61,47,224,.07); --glow: 0 0 0 1px rgba(61,47,224,.10), 0 10px 30px rgba(28,31,107,.10);
  color-scheme: light;
}
:root.dys { --ui: "OpenDyslexic", "Comic Sans MS", Verdana, sans-serif; --display: "OpenDyslexic", "Comic Sans MS", Verdana, sans-serif; }
* { box-sizing: border-box; }
html { font-size: 16px; }
body { margin: 0; min-height: 100vh; background: var(--bg) radial-gradient(circle at 1px 1px, var(--grid) 1.2px, transparent 0) 0 0 / 28px 28px; color: var(--ink); font: 1rem/1.55 var(--ui); }
.dys body { word-spacing: .08em; line-height: 1.8; }
.dys .home h1 { letter-spacing: 0; font-size: clamp(2rem, 6vw, 3rem); }
.dys .brand, .dys .bigcode, .dys .code-input { letter-spacing: .05em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0 0 .5em; text-wrap: balance; color: var(--head); }
h2 { font-size: 1.7rem; font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: .4em 0; }
a { color: var(--accent); }
.mono { font-family: var(--mono); }
.dys .mono { font-family: var(--ui); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .navy { color: var(--head); }
.strong { font-weight: 700; }
[hidden] { display: none !important; }

/* top bar */
.topbar { position: relative; display: flex; align-items: center; gap: 16px; background: var(--bg2); color: #fff; padding: 10px 20px; flex-wrap: wrap; border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, #5ce1ff, #a99bff 55%, transparent) 1; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: .04em; }
.logo { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 3px 10px 3px 10px; background: #5ce1ff; color: #071038; font-family: var(--display); font-weight: 800; }
.logo.big { width: 68px; height: 68px; font-size: 2.3rem; border-radius: 6px 22px 6px 22px; margin: 0 auto 14px; box-shadow: 0 0 34px rgba(92,225,255,.45); }
.spacer { flex: 1; }
.top-right { color: #dfe5ff; font-size: .95rem; }
.top-right .sep { margin: 0 10px; opacity: .5; }
.pill { font-size: .85rem; padding: 3px 12px; border-radius: 999px; background: #36409a; color: #fff; font-weight: 600; }
.pill.good { background: #5be3a0; color: #071038; } .pill.warn { background: #ffcb5c; color: #071038; } .pill.bad { background: #ff8292; color: #071038; }
.display-btn { background: transparent; border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: var(--r-btn); padding: 5px 12px; font-size: .9rem; font-weight: 600; cursor: pointer; }
.display-btn:hover, .display-btn[aria-expanded="true"] { border-color: #5ce1ff; color: #5ce1ff; }
.display-panel { position: absolute; right: 16px; top: calc(100% + 8px); z-index: 60; width: min(330px, calc(100vw - 32px)); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--glow); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.display-panel .label { display: block; margin-bottom: 5px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; background: var(--field); border: 1px solid var(--field-line); color: var(--ink); border-radius: var(--r-btn); padding: 7px 8px; cursor: pointer; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

/* layout */
main { padding: 26px 16px 56px; margin: 0 auto; }
.narrow { max-width: 580px; }
.wide { max-width: 1120px; }
.quiz { max-width: 1120px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 24px 26px; margin-bottom: 18px; min-width: 0; box-shadow: var(--glow); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.row.center { justify-content: center; }
.row.small-gap { gap: 6px; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.indent { margin: 4px 0 8px 28px; }
.disabled { opacity: .45; }
.gap { margin-left: 18px; }
@media (max-width: 820px) { .grid2, .dash-top, .editor { grid-template-columns: 1fr !important; } }

/* controls */
.btn { background: var(--accent); color: var(--on-accent); border: 1px solid transparent; border-radius: var(--r-btn); padding: 10px 20px; font-weight: 700; cursor: pointer; }
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.big { padding: 14px 28px; font-size: 1.08rem; }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--field-line); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btn.good { background: var(--good); color: var(--on-solid); } .btn.warn { background: var(--warn); color: var(--on-solid); }
.btn.navy { background: var(--violet); color: var(--on-solid); }
.btn.light { background: #fff; color: #171a45; }
.btn.ghost-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.tiny-btn { background: var(--card-2); color: var(--ink); border-color: var(--line); padding: 4px 12px; font-size: .85rem; font-weight: 600; }
.linkish { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; margin-top: 24px; font-size: 1rem; }
.input { width: 100%; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: var(--r-in); background: var(--field); color: var(--ink); }
.input::placeholder { color: var(--muted); opacity: .7; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.input.tiny { width: 80px; }
.code-input { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .25em; text-transform: uppercase; }
label { font-weight: 600; }
.radio, .check { display: flex; gap: 8px; align-items: center; font-weight: 400; padding: 3px 0; }
.radio.inline { display: inline-flex; margin-right: 10px; }
input[type=radio], input[type=checkbox] { accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.field > span, .label { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 0; }
.grow { flex: 1; }
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.msg { min-height: 1.4em; margin: 4px 0; }
.msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
.hint { color: var(--muted); font-size: .85rem; margin: 2px 0; }
.notice { background: var(--warn-soft); border: 1px solid var(--warn); padding: 10px 14px; border-radius: var(--r-in); margin: 12px 0; }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
select.input { width: auto; max-width: 100%; }
select.input option { background: var(--card); color: var(--ink); }

/* home */
.home { max-width: 780px; text-align: center; padding-top: 6vh; }
.home h1 { font-size: clamp(2.6rem, 8vw, 4.2rem); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .2em; }
.home-title p { max-width: 46ch; margin: 0 auto; }
.role-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
@media (max-width: 600px) { .role-row { grid-template-columns: 1fr; } }
.role { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 28px 24px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; color: var(--ink); box-shadow: var(--glow); }
.role:hover { border-color: var(--accent); }
.role-kicker { font-size: .9rem; color: var(--accent); font-weight: 600; }
.role-title { font-family: var(--display); font-size: 1.7rem; font-weight: 800; color: var(--head); }
.role-sub { color: var(--muted); }

/* lobby */
.lead { font-size: 1.15rem; }
.rules { padding-left: 1.2em; }
.rules li { margin: 4px 0; }
.mon { font-weight: 700; min-height: 1.5em; }
.mon.good { color: var(--good); } .mon.bad { color: var(--bad); }

/* quiz */
.cd { text-align: center; padding: 70px 20px; }
.cd-q { font-family: var(--display); font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.cd-num { font-family: var(--display); font-size: 8rem; font-weight: 800; color: var(--head); line-height: 1.1; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px var(--accent-soft); }
.cd-num.go { color: var(--good); }
.qcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.qcard.with-graph { grid-template-columns: minmax(0, 1fr) 320px; }
@media (max-width: 820px) { .qcard.with-graph { grid-template-columns: minmax(0, 1fr); } }
.kicker { font-family: var(--display); font-size: .95rem; color: var(--accent); font-weight: 700; margin: 0; }
.question { font-size: 1.2rem; font-weight: 600; white-space: pre-wrap; margin: 8px 0 16px; user-select: none; -webkit-user-select: none; max-width: 70ch; }
.question:not(.mono) { font-family: var(--ui); font-size: 1.3rem; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.answer { width: min(380px, 100%); font-size: 1.2rem; }
.howto { color: var(--muted); font-size: .9rem; margin: 6px 0 14px; }
.howto.bad { color: var(--bad); font-weight: 700; }
.race { margin: 6px 0; }
.race-row { margin: 2px 0; }
.time { font-variant-numeric: tabular-nums; }
.bar { height: 14px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin: 4px 0; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--warn)); border-radius: 9px; transition: width .1s linear; }
.rmsg { color: var(--muted); margin: 2px 0; }
.rmsg.warn { color: var(--warn); font-weight: 700; } .rmsg.bad { color: var(--bad); }
.rmsg.big { font-size: 1.15rem; font-weight: 800; }
.fb { margin-top: 10px; }
.verdict { font-family: var(--display); font-size: 1.35rem; font-weight: 800; margin: 6px 0; }
.ans { font-weight: 700; font-size: 1.1rem; }
.sol { white-space: pre-wrap; font-family: var(--ui); background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-in); padding: 10px 14px; margin: 6px 0; line-height: 1.6; }
.round { font-weight: 800; font-size: 1.1rem; }
.graph-wrap { align-self: start; }
.graph { width: 100%; max-width: 320px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.graph .gl { stroke: #e3e8f0; } .graph .ax { stroke: #333; }
.graph .tick { font-size: 8px; fill: #555; }
.graph .curve { fill: none; stroke: #1c1f6b; stroke-width: 3; stroke-linejoin: round; }
.graph .dot { fill: #1c1f6b; }
.graph .glabel { font-size: 11px; font-style: italic; fill: #1c1f6b; }

.cd-num.brk { font-size: 5.5rem; color: var(--accent); }
.wrapline { flex-wrap: wrap; }
.wrapline .input.tiny { width: 64px; padding: 6px 8px; }
.music-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
/* focus sounds bar */
.music-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 18px; background: var(--bg2); color: #fff; border-top: 1px solid transparent; border-image: linear-gradient(90deg, #5ce1ff, #a99bff 55%, transparent) 1; }
.music-label { font-family: var(--display); font-weight: 700; letter-spacing: .04em; }
.music-bar select.input { padding: 6px 8px; background: #141a55; color: #fff; border-color: #5560c4; max-width: min(320px, 60vw); }
.music-bar select.input option, .music-bar select.input optgroup { background: #141a55; color: #fff; }
.music-play { min-width: 76px; background: #5ce1ff; color: #071038; }
.music-vol { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: .9rem; color: #dfe5ff; }
.music-vol input { width: 130px; accent-color: #5ce1ff; }
.has-music main { padding-bottom: 96px; }

/* form layout */
.form-q { margin-bottom: 14px; }
.form-q.needs-fix { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.form-q .answer { margin-bottom: 4px; }
.form-foot .msg:empty { display: none; }

/* focus session */
.home-links { display: flex; gap: 8px 28px; justify-content: center; flex-wrap: wrap; }
.focus-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; margin: 8px 0; }
@media (max-width: 520px) { .focus-fields { grid-template-columns: 1fr; } }
.focus-code { font-size: 2rem; letter-spacing: .06em; margin: 0 0 8px; overflow-wrap: anywhere; }
.focus-link { overflow-wrap: anywhere; color: var(--muted); }
.focus-main { padding-top: 6vh; }
.focus-card { text-align: center; padding: 36px 26px; }
.focus-phase { font-family: var(--display); font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 0; }
.focus-goal { color: var(--muted); margin: 4px 0 0; }
.focus-time { font-family: var(--display); font-weight: 800; font-size: clamp(5rem, 22vw, 10rem); line-height: 1.05; color: var(--head); font-variant-numeric: tabular-nums; text-shadow: 0 0 40px var(--accent-soft); }
.focus-card.is-break .focus-phase, .focus-card.is-break .focus-time { color: var(--good); }
.focus-card.is-pause .focus-phase, .focus-card.is-pause .focus-time { color: var(--warn); }
.focus-fill { background: var(--accent); transition: none; }
.is-break .focus-fill { background: var(--good); } .is-pause .focus-fill { background: var(--warn); }
.focus-dots { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; }
.focus-dot { width: 14px; height: 14px; border-radius: 3px 7px 3px 7px; border: 1px solid var(--field-line); }
.focus-dot.done { background: var(--accent); border-color: var(--accent); } .focus-dot.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.focus-info { min-height: 1.6em; }
.focus-pin label { font-weight: 600; }
.focus-pin .msg { flex-basis: 100%; }

/* references */
.ref-rows { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; align-items: flex-start; }
.ref-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 6px; width: 100%; }
@media (max-width: 600px) { .ref-row { grid-template-columns: 1fr; } }
.topbar .tiny-btn { margin-right: 6px; }
.ref-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 45; width: min(760px, 94vw); display: flex; flex-direction: column; background: var(--card); border-left: 1px solid var(--accent); box-shadow: -18px 0 50px rgba(4,6,30,.5); }
.ref-head { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ref-tabs { display: flex; gap: 6px; flex: 1; overflow-x: auto; }
.ref-tab { background: var(--field); color: var(--ink); border: 1px solid var(--field-line); border-radius: var(--r-btn); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.ref-tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.ref-body { flex: 1; min-height: 0; background: #fff; display: flex; }
.ref-frame { flex: 1; width: 100%; border: 0; background: #fff; }
.ref-notes { flex: 1; white-space: pre-wrap; overflow: auto; user-select: none; -webkit-user-select: none; }
.ref-empty { margin: auto; color: #535c8e; padding: 20px; }
.ref-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-top: 1px solid var(--line); }
.has-music .ref-panel { bottom: 54px; }

/* per-question help: spell / grammar / dictionary */
.tool-opts { margin: 10px 0; padding: 10px 12px; border: 1px dashed var(--field-line); border-radius: var(--r-in); }
.gram { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; flex-basis: 100%; }
.gram-list ul { margin: 0; padding-left: 1.2em; }
.gram-list li { margin: 3px 0; }
.dict-on .question { user-select: text; -webkit-user-select: text; cursor: text; }
.dict-chip { position: fixed; z-index: 70; background: var(--accent); color: var(--on-accent); border: 0; border-radius: var(--r-btn); padding: 6px 12px; font-weight: 700; cursor: pointer; box-shadow: var(--glow); }
.dict-pop { position: fixed; z-index: 70; width: min(420px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; background: var(--card); color: var(--ink); border: 1px solid var(--accent); border-radius: var(--r-card); padding: 12px 16px; box-shadow: var(--glow); }
.dict-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
.dict-word { font-family: var(--display); font-size: 1.3rem; color: var(--head); }
.dict-m { margin: 8px 0; }
.dict-ex { margin: 3px 0 0; }

.ai-steps li { margin: 14px 0; }
.ai-steps textarea { margin-top: 6px; }

/* connection light in the quiz */
.net { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; font-size: .85rem; }
.net::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.net.on { color: #5be3a0; } .net.sending { color: #ffcb5c; } .net.off { color: #ff8292; font-weight: 700; }
/* several quizzes at once */
.quiz-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.quiz-tab { background: var(--field); color: var(--ink); border: 1px solid var(--field-line); border-radius: var(--r-btn); padding: 6px 12px; cursor: pointer; font-weight: 600; }
.quiz-tab[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dash td .email { font-weight: 400; }
/* continue / redo keys */
.keys { border: 1px dashed var(--field-line); border-radius: var(--r-in); padding: 10px 12px; margin: 8px 0 12px; }
.key-list { margin: 6px 0 0; padding-left: 1.2em; }
.bigkey { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--accent); letter-spacing: .12em; }
.key-new .bigkey { font-size: 1.8rem; }
.log .warn { color: var(--warn); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; color: #fff; }
.overlay.red { background: #a81f36; } .overlay.navy { background: #0a0d31; }
#help-panel { z-index: 95; }
.ov-box { max-width: 560px; text-align: center; }
.ov-box h2 { color: #fff; font-size: 2.2rem; }
.ov-wait { color: #ffe08a; font-weight: 700; margin: 14px 0; }
.ov-msg { color: #ffe08a; min-height: 1.4em; }
.pin-in { width: 180px; text-align: center; font-size: 1.4rem; margin: 6px auto 0; display: block; background: #fff; color: #171a45; border-color: #fff; }
.overlay label { font-weight: 400; font-size: .9rem; }

/* results */
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.stat { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-in); padding: 10px 16px; min-width: 110px; display: flex; flex-direction: column; }
.stat-v { font-family: var(--display); font-size: 1.6rem; font-weight: 800; color: var(--head); font-variant-numeric: tabular-nums; }
.stat-l { font-size: .85rem; color: var(--muted); }
.results { padding-left: 1.4em; }
.res { margin: 10px 0; }
.res-head { display: flex; gap: 10px; align-items: baseline; }
.tag { font-size: .8rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.res.good .tag { background: var(--good-soft); color: var(--good); }
.res.warn .tag { background: var(--warn-soft); color: var(--warn); }
.res.bad .tag { background: var(--bad-soft); color: var(--bad); }

/* teacher */
.editor { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; }
.qlist { padding-left: 1.4em; max-height: 420px; overflow: auto; margin: 0 0 8px; }
.qlist li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.qlist li:hover { background: var(--card-2); } .qlist li.sel { background: var(--accent-soft); font-weight: 600; }
.dash-top { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dash-top.three { grid-template-columns: 1fr 1fr 1.25fr; }
.dash-top .card .btn { margin: 6px 0; }
.bigcode { font-family: var(--display); font-size: 3.2rem; font-weight: 800; color: var(--accent); letter-spacing: .14em; }
.pin { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--bad); letter-spacing: .2em; }
.table-wrap { overflow-x: auto; }
table.dash { width: 100%; border-collapse: collapse; font-size: .95rem; }
.dash th { text-align: left; font-size: .82rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.dash td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dash td.num { text-align: center; font-variant-numeric: tabular-nums; }
.dash td.name { font-weight: 700; }
.dash td.empty { text-align: center; color: var(--muted); padding: 26px; white-space: normal; }
.dash tr.frozen td { background: var(--bad-soft); }
.dash tr.frozen td:nth-child(3) { color: var(--bad); font-weight: 700; }
.dash tr.leave td { background: var(--warn-soft); }
.dash tr.done td { background: var(--good-soft); }
.dash tr.gone td { color: var(--muted); opacity: .75; }
.dash td.togr { background: var(--warn-soft); font-weight: 800; color: var(--warn); }
.log { max-height: 220px; overflow: auto; font-size: .85rem; background: var(--card-2); border-radius: var(--r-in); padding: 8px 12px; }
.log .bad { font-weight: 700; }

/* answer inputs */
.answer-col { display: flex; flex-direction: column; gap: 12px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--field-line); border-radius: var(--r-in); cursor: pointer; font-weight: 400; font-size: 1.05rem; background: var(--field); }
.choice:hover { border-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.choice:has(input:disabled) { cursor: default; opacity: .8; }
.choice input { width: 18px; height: 18px; flex: none; }

/* the writing page (long answers): toolbar + white paper */
.writer { border: 1px solid var(--field-line); border-radius: var(--r-in); overflow: hidden; background: var(--card-2); }
.tools { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
.tools select { background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 6px; padding: 5px 4px; font-size: .88rem; max-width: 130px; cursor: pointer; }
.tools select:hover, .tools select:focus { border-color: var(--field-line); background: var(--field); }
.tools select.font { width: 112px; }
.tools select.size { width: 52px; text-align: center; border-color: var(--field-line); }
.tool { min-width: 30px; height: 30px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink);
  border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-family: Georgia, "Times New Roman", serif; font-size: 1rem; line-height: 1; }
.tool:hover { background: var(--field); border-color: var(--field-line); }
.tool.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }
.tool sup, .tool sub { font-size: .65em; }
.tool:disabled, .tools select:disabled, .swatch:disabled { opacity: .45; cursor: default; }
.ticon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tspacing { display: inline-flex; align-items: center; gap: 0; border-radius: 6px; padding-left: 4px; }
.tspacing select { width: 22px; padding: 5px 0; color: transparent; }
.tspacing select option { color: var(--ink); background: var(--card); }
.tspacing:hover { background: var(--field); }
.tmenu { position: relative; display: inline-flex; }
.tcol { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
.tcol .tA { font-family: Arial, sans-serif; font-size: .95rem; }
.tcol .tH { font-size: .95rem; }
.cbar { display: block; width: 18px; height: 4px; border-radius: 2px; outline: 1px solid var(--field-line); }
.tpanel { position: absolute; top: 34px; left: 0; z-index: 30; background: var(--card); border: 1px solid var(--field-line); border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); min-width: 190px; }
.tpanel .swatches { display: grid; grid-template-columns: repeat(4, 30px); gap: 6px; }
.custom-colour { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .85rem; color: var(--muted); }
.custom-colour input { width: 40px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
.tpanel.symbols { display: grid; grid-template-columns: repeat(8, 30px); gap: 4px; min-width: 0; }
.sym { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); font-size: 1rem; cursor: pointer; }
.sym:hover { background: var(--field); border-color: var(--field-line); }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card-2); outline: 1px solid var(--field-line); cursor: pointer; padding: 0; }
.swatch:hover { outline: 2px solid var(--accent); }
.swatch.none { background: #fff linear-gradient(135deg, transparent 45%, #d4213d 45%, #d4213d 55%, transparent 55%); }
.paper blockquote { margin: .4em 0 .4em 1em; padding-left: .8em; border-left: 3px solid #b8bfd6; color: inherit; }
.paper hr { border: 0; border-top: 1px solid #b8bfd6; margin: .8em 0; }
.paper h1, .paper h2, .paper h3 { text-transform: none; letter-spacing: normal; text-shadow: none; background: none; -webkit-text-fill-color: currentColor; }
.paper h3 { font-family: inherit; color: inherit; font-size: 1.12em; margin: .5em 0 .25em; }
.paper ul, .paper ol { margin: .2em 0 .4em; padding-left: 1.6em; }
.paper { text-align: left; background: var(--paper); color: var(--paper-ink); font-family: "Lexend", "Segoe UI", Arial, sans-serif; font-size: 1.05rem; line-height: 1.6; padding: 16px 20px; overflow-wrap: anywhere; }
.dys .paper { font-family: "OpenDyslexic", "Comic Sans MS", Verdana, sans-serif; line-height: 1.8; }
.paper h1 { font-family: inherit; color: inherit; font-size: 1.7em; margin: .2em 0 .4em; }
.paper h2 { font-family: inherit; color: inherit; font-size: 1.3em; margin: .6em 0 .3em; }
.paper p, .paper div { margin: 0 0 .2em; }
.long-answer { min-height: 260px; max-height: 60vh; overflow: auto; outline: none; }
.long-answer:focus { box-shadow: inset 0 0 0 3px var(--accent); }
.long-answer:empty::before { content: "Write your answer here..."; color: #8189b3; }
.writer-foot { display: flex; justify-content: flex-end; padding: 4px 10px; font-size: .85rem; color: var(--muted); }
.your-answer { white-space: pre-wrap; font-family: var(--ui); margin: 4px 0; font-size: .95rem; }
.your-answer.paper { white-space: normal; border-radius: var(--r-in); max-height: 260px; overflow: auto; }

/* teacher: writing questions + grading */
.fields { margin: 8px 0; display: flex; flex-direction: column; gap: 8px; }
.opt-row { display: flex; gap: 10px; align-items: center; }
.opt-row input[type=radio] { width: 18px; height: 18px; flex: none; }
.quiz-name { align-items: flex-end; margin: 0 0 14px; }
.type-tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
.name-btn { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--accent); text-decoration: underline; cursor: pointer; }
.need-grade { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 600; margin: 0 0 16px; }
.rev-item { border-top: 1px solid var(--line); padding: 12px 0; }
.rev-item.need { background: var(--warn-soft); margin: 0 -26px; padding: 12px 26px; }
.rev-q { margin: 0 0 6px; }
.rev-a { white-space: pre-wrap; font-family: var(--ui); background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-in); padding: 10px 12px; margin: 0 0 6px; max-height: 260px; overflow: auto; }
.rev-a.paper { white-space: normal; background: var(--paper); max-height: 420px; }
@media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

.home-app { max-width: 640px; margin: 28px auto 0; text-align: left; }
.app-dl a.btn { text-decoration: none; }
.app-dl details { margin-top: 10px; }
.app-dl summary { cursor: pointer; }
.app-help ol { margin: 6px 0 8px; padding-left: 22px; text-align: left; }
.app-help .bigcode { font-size: 2rem; }
.app-help.flash { outline: 2px solid var(--accent, #5ce1ff); }
.live-view { margin: 4px 0 14px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--good, #2ecc71) 45%, transparent); border-radius: var(--r-in); }
.live-head { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; flex-wrap: wrap; }
.live-dot { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 0 0 rgba(46,204,113,.6); }
.live-dot.typing { animation: livepulse 1.2s infinite; }
.live-dot.off { background: #8a90a8; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(46,204,113,.6); } 70% { box-shadow: 0 0 0 9px rgba(46,204,113,0); } 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); } }
.live-text { max-height: 320px; overflow: auto; }
.rev-sub { margin: 14px 0 6px; }
/* printing */
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing { background: #fff !important; color: #000; font: 11.5pt/1.45 Georgia, "Times New Roman", serif; }
  body.printing #print-area { display: block; }
  #print-area h1, #print-area h2 { color: #000 !important; -webkit-text-fill-color: #000; background: none !important; text-shadow: none !important; font-family: Georgia, serif; letter-spacing: 0; text-transform: none; }
  #print-area h1 { font-size: 18pt; margin: 0 0 4pt; }
  #print-area h2 { font-size: 14pt; margin: 0 0 2pt; }
  .p-head { border-bottom: 1.5pt solid #000; padding-bottom: 8pt; margin-bottom: 14pt; }
  .p-name { display: flex; gap: 18pt; margin-top: 10pt; }
  .p-blank { display: inline-block; min-width: 180pt; border-bottom: 1pt solid #000; }
  .p-blank.short { min-width: 70pt; }
  .p-item { break-inside: avoid; margin: 0 0 14pt; }
  .p-q { white-space: pre-wrap; }
  .p-opts { list-style: none; padding: 0; margin: 6pt 0 0 14pt; }
  .p-opts li { margin: 3pt 0; }
  .p-yn { margin: 6pt 0 0 14pt; display: flex; gap: 30pt; }
  .p-bubble { display: inline-flex; align-items: center; justify-content: center; width: 13pt; height: 13pt; border: 1pt solid #000; border-radius: 50%; font-size: 8pt; margin-right: 6pt; }
  .p-right { font-weight: bold; }
  .p-right .p-bubble { border-width: 2.5pt; }
  .p-lines { margin: 4pt 0 0 14pt; }
  .p-line { border-bottom: .75pt solid #888; height: 22pt; }
  .p-ans, .p-their, .p-pts { margin: 3pt 0 0 14pt; white-space: pre-wrap; }
  .p-ans.muted, #print-area .muted { color: #444; }
  .p-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  .p-table th, .p-table td { border: .75pt solid #000; padding: 3pt 5pt; text-align: left; }
  .p-student { break-before: page; }
  @page { margin: 16mm; }
}
</style>
